<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحياة المتوازنة — الباقة الشاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep-purple:#4A1D6E;--soft-purple:#8B5CF6;--light-purple:#D8B4FE;--pale-lavender:#F3E8FF;--gold-primary:#D4A843;--gold-light:#F5E6B8;--bg-cream:#FFFAF5;--text-dark:#2D1B3E;--text-gray:#6B5B7B;--card-bg:#FFFFFF;--border-soft:#E8DFF0;--success-green:#22C55E;--star-filled:#D4A843;--star-empty:#E2D4F0;--hour-odd:#FAF7FF;--sidebar-w:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;direction:rtl;background:#FAF7FF;color:var(--text-dark);overflow:hidden;height:100vh}
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:linear-gradient(180deg,var(--deep-purple),#3A1558);display:flex;flex-direction:column;z-index:1000;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.sidebar-brand{padding:18px 14px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand h2{color:var(--gold-primary);font-size:19px;font-weight:800;line-height:1.3}
.sidebar-brand .sub{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;color:rgba(255,255,255,.65);transition:all .25s;font-size:13px;font-weight:500;border-right:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.active{background:rgba(212,168,67,.12);color:var(--gold-primary);border-right-color:var(--gold-primary);font-weight:700}
.nav-item .ico{font-size:17px;width:24px;text-align:center}
.sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1)}
.pdf-btn{width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold-primary),#C49430);color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,168,67,.4)}
.main{margin-right:var(--sidebar-w);height:100vh;overflow-y:auto;padding:20px;background:linear-gradient(135deg,#F3E8FF 0%,#FFFAF5 50%,#FFF5F0 100%)}
.tab-content{display:none}.tab-content.active{display:block}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--deep-purple);color:white;padding:10px 24px;border-radius:10px;font-size:14px;opacity:0;transition:all .4s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sp-card{background:white;border:1.5px solid var(--border-soft);border-radius:12px;padding:16px;margin-bottom:12px}
.sp-card h3{font-size:15px;font-weight:700;color:var(--deep-purple);margin-bottom:10px}
.sp-table{width:100%;border-collapse:collapse;font-size:13px}
.sp-table th{background:linear-gradient(180deg,var(--deep-purple),var(--soft-purple));color:white;padding:5px 4px;font-weight:500;text-align:center;border:1px solid rgba(255,255,255,.15)}
.sp-table td{border:1px solid var(--border-soft);text-align:center;padding:4px}
.sp-table td:first-child{font-weight:700;color:var(--text-dark);text-align:right;padding-right:8px}
.aya-box{text-align:center;padding:20px;background:linear-gradient(135deg,var(--pale-lavender),#FFF0F5);border-radius:12px;margin-bottom:12px;border:1.5px solid var(--border-soft)}
.aya-text{font-size:22px;font-weight:700;color:var(--deep-purple);line-height:1.8}
.aya-ref{font-size:13px;color:var(--text-gray);margin-top:4px}
.s-tab-btn{flex:1;padding:8px 12px;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-gray);transition:all .25s}
.s-tab-btn.active{background:linear-gradient(135deg,var(--deep-purple),var(--soft-purple));color:white;font-weight:700}
.s-page{display:none}.s-page.active{display:block}
.cb-mini{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cb-mini input{display:none}
.cb-mini .cb-m-box{width:18px;height:18px;border:2px solid var(--border-soft);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:white;background:white}
.cb-mini input:checked+.cb-m-box{background:var(--success-green);border-color:var(--success-green)}
.cb-mini input:checked+.cb-m-box::after{content:"✓"}
.khatma-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.khatma-grid .cb-mini{flex-direction:column;gap:2px;font-size:11px;color:var(--text-gray)}
.khatma-grid .cb-mini .cb-m-box{width:22px;height:22px;border-radius:6px}
.dua-area{width:100%;min-height:80px;border:1.5px solid var(--border-soft);border-radius:8px;padding:10px;font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;outline:none;background:#FDFBFF}

/* ===== HAMBURGER MENU ===== */
.hamburger{display:none;position:fixed;top:16px;right:16px;z-index:2000;width:40px;height:40px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--deep-purple),var(--soft-purple));color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(74,29,110,.3);transition:all .25s;align-items:center;justify-content:center}
.hamburger:hover{transform:scale(1.05)}
.hamburger.active{right:236px}
.sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:999;opacity:0;transition:opacity .3s}
.sidebar-overlay.show{opacity:1}
.sidebar{transition:transform .3s ease;z-index:1000}
@media(max-width:768px){
  .hamburger{display:flex}
  .sidebar{transform:translateX(100%);box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:-4px 0 20px rgba(0,0,0,.15)}
  .main{margin-right:0}
  .sidebar-overlay.show{display:block}
  .hamburger.active{right:16px}
}
@media print{.hamburger,.sidebar-overlay{display:none!important}.sidebar{transform:none!important;position:static!important;width:auto!important;height:auto!important}.main{margin-right:0!important}}

@media print{@page{margin:5mm}.sidebar{display:none!important}.main{margin-right:0!important;padding:0!important;overflow:visible!important;height:auto!important}body{overflow:visible!important}.toast{display:none!important}.tab-content{display:block!important;page-break-after:always}.tab-content:last-child{page-break-after:auto}.btn,.footer-actions{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>


<aside class="sidebar">
  <div class="sidebar-brand"><h2>🌸 الحياة<br>المتوازنة</h2><div class="sub">الباقة الشاملة v1.0</div></div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <div class="nav-item active" data-tab="weekly"><span class="ico">🗓️</span>مخطط الأسبوع</div>

    <div class="nav-item" data-tab="habits"><span class="ico">📊</span>العادات الشهرية</div>
    <div class="nav-item" data-tab="stickers"><span class="ico">📔</span>كتاب الملصقات</div>
    <div class="nav-item" data-tab="spiritual"><span class="ico">🕌</span>روحانيات</div>
  </nav>
  <div class="sidebar-footer"><button class="pdf-btn" onclick="window.print()">🖨️ PDF</button></div>
</aside>

<main class="main" id="main-content"></main>
<div class="toast" id="toast"></div>

<script>
const TAB_BODIES={};
const TAB_SCRIPTS={};
TAB_BODIES['weekly'] = `<div class="spread">

  <!-- ====== LEFT PAGE ====== -->
  <div class="page page-left">

    <div class="week-header">
      <h2>📅 الأسبوع رقم: <input type="text" id="week-number" placeholder="___" style="width:60px;border:none;border-bottom:2px solid var(--deep-purple);outline:none;font-family:'Tajawal',sans-serif;font-size:20px;font-weight:800;color:var(--deep-purple);background:transparent;"></h2>
      <div class="week-dates">
        <div class="date-input-group"><span class="icon">📆</span><input type="text" id="from-greg" placeholder="من: يوم/شهر"></div>
        <span style="color:var(--text-gray);font-size:12px;">→</span>
        <div class="date-input-group"><span class="icon">📆</span><input type="text" id="to-greg" placeholder="إلى: يوم/شهر"></div>
        <span style="color:var(--text-gray);font-size:12px;margin:0 2px;">|</span>
        <div class="date-input-group"><span class="icon">🌙</span><input type="text" id="from-hijri" placeholder="من: يوم/شهر"></div>
        <span style="color:var(--text-gray);font-size:12px;">→</span>
        <div class="date-input-group"><span class="icon">🌙</span><input type="text" id="to-hijri" placeholder="إلى: يوم/شهر"></div>
      </div>
    </div>

    <div class="top-priorities">
      <h3>⭐ أولويات الأسبوع الكبرى</h3>
      <div class="priority-item">
        <label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label>
        <input type="text" placeholder="الأولوية الأولى...">
      </div>
      <div class="priority-item">
        <label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label>
        <input type="text" placeholder="الأولوية الثانية...">
      </div>
      <div class="priority-item">
        <label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label>
        <input type="text" placeholder="الأولوية الثالثة...">
      </div>
    </div>

    <div class="days-table">
      <h3>🗓️ أيام الأسبوع</h3>
      <div id="days-container"></div>
    </div>

    <div class="quick-tasks">
      <h3>📝 مهام الأسبوع</h3>
      <div id="quick-tasks-container"></div>
    </div>
  </div>

  <!-- ====== RIGHT PAGE ====== -->
  <div class="page page-right">

    <div class="section-card">
      <h3>🚀 أهم إنجازات الأسبوع</h3>
      <div id="achievements-container"></div>
    </div>

    <div class="section-card reflection-box" style="flex:1;">
      <h3>💭 تأملات الأسبوع</h3>
      <textarea id="reflection-text" placeholder="اكتبي تأملاتك... ماذا شعرت؟ ماذا تعلمت؟"></textarea>
      <div class="little-input-row">
        <span class="emoji-label">📖</span>
        <input type="text" id="lesson-learned" placeholder="درس تعلمته هذا الأسبوع">
      </div>
      <div class="little-input-row">
        <span class="emoji-label">💧</span>
        <input type="text" id="gratitude" placeholder="شكر / امتنان">
      </div>
    </div>

    <div class="section-card">
      <h3>🔮 نظرة على الأسبوع القادم</h3>
      <div class="next-week-grid">
        <div><input type="text" id="next-week-num" placeholder="الأسبوع رقم: ___" style="border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:14px;padding:2px 0;width:160px;background:transparent;"></div>
        <div class="next-priority-row"><label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label><input type="text" placeholder="أولوية أولى للأسبوع القادم"></div>
        <div class="next-priority-row"><label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label><input type="text" placeholder="أولوية ثانية"></div>
        <div class="next-priority-row"><label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label><input type="text" placeholder="أولوية ثالثة"></div>
        <div style="margin-top:4px;"><span style="font-size:13px;color:var(--text-gray);">📌 مواعيد مهمة:</span></div>
        <div class="next-appt-row"><label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label><input type="text" placeholder="موعد ١"></div>
        <div class="next-appt-row"><label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label><input type="text" placeholder="موعد ٢"></div>
        <div class="little-input-row" style="margin-top:4px;">
          <span class="emoji-label">🤲</span>
          <input type="text" id="next-dua" placeholder="دعاء الأسبوع القادم">
        </div>
      </div>
    </div>
  </div>

</div>

<div class="footer-actions">
  <button class="btn btn-primary" onclick="saveData()">💾 حفظ التقدم</button>
  <button class="btn btn-outline" onclick="clearAll()">🔄 تفريغ الكل</button>
  <button class="btn btn-outline" onclick="window.print()">🖨️ طباعة / PDF</button>
</div>

<div id="toast" class="toast"></div>`;
TAB_SCRIPTS['weekly'] = `
// ====== DAYS OF WEEK (Arabic start: Saturday) ======
const DAYS = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

function buildDayRow(dayName, idx) {
  const row = document.createElement('div');
  row.className = 'day-row';
  row.innerHTML = \`
    <span class="day-name">\${dayName}</span>
    <div class="day-date">
      <input type="text" class="d-greg" placeholder="يوم" maxlength="2">
      <span class="sep">/</span>
      <input type="text" class="m-greg" placeholder="شهر" maxlength="2">
      <span class="sep">|</span>
      <input type="text" class="d-hijri" placeholder="هـ" maxlength="2">
      <span class="sep">/</span>
      <input type="text" class="m-hijri" placeholder="شهر" maxlength="2">
    </div>
    <div class="day-icons">
      <button class="icon-btn coffee" title="قهوة/استراحة" data-key="coffee">☕</button>
      <button class="icon-btn appt" title="موعد" data-key="appt">📅</button>
      <button class="icon-btn star-icon" title="إنجاز" data-key="star">⭐</button>
      <button class="icon-btn task-icon" title="مهمة كبيرة" data-key="task">📌</button>
    </div>
  \`;

  // Toggle icon buttons
  row.querySelectorAll('.icon-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      this.classList.toggle('active');
      autoSave();
    });
  });

  // Auto-save on date input change
  row.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', autoSave);
  });

  return row;
}

function buildDays() {
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  DAYS.forEach((name, i) => {
    container.appendChild(buildDayRow(name, i));
  });
}
buildDays();

// ====== QUICK TASKS ======
function buildQuickTasks(count = 6) {
  const container = document.getElementById('quick-tasks-container');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'task-item';
    div.innerHTML = \`
      <label class="cb-container"><input type="checkbox"><span class="cb-check"></span></label>
      <input type="text" placeholder="مهمة...">
    \`;
    div.querySelector('input[type="text"]').addEventListener('input', autoSave);
    div.querySelector('input[type="checkbox"]').addEventListener('change', autoSave);
    container.appendChild(div);
  }
}
buildQuickTasks();

// ====== STAR RATING ======
function createStarRating(container) {
  const wrapper = document.createElement('div');
  wrapper.className = 'star-rating';
  for (let i = 1; i <= 5; i++) {
    const span = document.createElement('span');
    span.className = 'star';
    span.textContent = '★';
    span.dataset.value = i;
    span.addEventListener('click', function() {
      const val = parseInt(this.dataset.value);
      const siblings = this.parentElement.querySelectorAll('.star');
      siblings.forEach(s => {
        s.classList.toggle('filled', parseInt(s.dataset.value) <= val);
      });
      autoSave();
    });
    wrapper.appendChild(span);
  }
  container.appendChild(wrapper);
  return wrapper;
}

// ====== ACHIEVEMENTS ======
function buildAchievements(count = 3) {
  const container = document.getElementById('achievements-container');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'achievement-item';
    const txt = document.createElement('input');
    txt.type = 'text';
    txt.placeholder = '🌟 إنجاز ' + (i + 1) + '...';
    txt.addEventListener('input', autoSave);
    div.appendChild(txt);
    const stars = document.createElement('div');
    stars.className = 'star-rating-wrap';
    createStarRating(stars);
    div.appendChild(stars);
    container.appendChild(div);
  }
}
buildAchievements();

// ====== SAVE / LOAD ======
const STORAGE_KEY = 'hayaat_weekly_spread';

function gatherData() {
  const data = {
    weekNumber: document.getElementById('week-number').value,
    fromGreg: document.getElementById('from-greg').value,
    toGreg: document.getElementById('to-greg').value,
    fromHijri: document.getElementById('from-hijri').value,
    toHijri: document.getElementById('to-hijri').value,
    priorities: [],
    days: [],
    quickTasks: [],
    achievements: [],
    reflection: document.getElementById('reflection-text').value,
    lesson: document.getElementById('lesson-learned').value,
    gratitude: document.getElementById('gratitude').value,
    nextWeekNum: document.getElementById('next-week-num').value,
    nextPriorities: [],
    nextAppointments: [],
    nextDua: document.getElementById('next-dua').value
  };

  // Priorities
  document.querySelectorAll('.top-priorities .priority-item').forEach(item => {
    const cb = item.querySelector('input[type="checkbox"]').checked;
    const txt = item.querySelector('input[type="text"]').value;
    data.priorities.push({ checked: cb, text: txt });
  });

  // Days
  document.querySelectorAll('.day-row').forEach(row => {
    data.days.push({
      gregD: row.querySelector('.d-greg').value,
      gregM: row.querySelector('.m-greg').value,
      hijriD: row.querySelector('.d-hijri').value,
      hijriM: row.querySelector('.m-hijri').value,
      coffee: row.querySelector('.coffee')?.classList.contains('active') || false,
      appt: row.querySelector('.appt')?.classList.contains('active') || false,
      star: row.querySelector('.star-icon')?.classList.contains('active') || false,
      task: row.querySelector('.task-icon')?.classList.contains('active') || false
    });
  });

  // Quick tasks
  document.querySelectorAll('.quick-tasks .task-item').forEach(item => {
    data.quickTasks.push({
      checked: item.querySelector('input[type="checkbox"]').checked,
      text: item.querySelector('input[type="text"]').value
    });
  });

  // Achievements with star ratings
  document.querySelectorAll('.achievement-item').forEach(item => {
    const txt = item.querySelector('input[type="text"]').value;
    const rating = item.querySelector('.star-rating');
    let value = 0;
    if (rating) {
      rating.querySelectorAll('.star').forEach(s => {
        if (s.classList.contains('filled')) value = Math.max(value, parseInt(s.dataset.value));
      });
    }
    data.achievements.push({ text: txt, rating: value });
  });

  // Next week priorities
  document.querySelectorAll('.next-week-grid .next-priority-row').forEach(item => {
    const cb = item.querySelector('input[type="checkbox"]').checked;
    const txt = item.querySelector('input[type="text"]').value;
    data.nextPriorities.push({ checked: cb, text: txt });
  });

  // Next week appointments
  document.querySelectorAll('.next-week-grid .next-appt-row').forEach(item => {
    const cb = item.querySelector('input[type="checkbox"]').checked;
    const txt = item.querySelector('input[type="text"]').value;
    data.nextAppointments.push({ checked: cb, text: txt });
  });

  return data;
}

function applyData(data) {
  if (!data) return;
  document.getElementById('week-number').value = data.weekNumber || '';
  document.getElementById('from-greg').value = data.fromGreg || '';
  document.getElementById('to-greg').value = data.toGreg || '';
  document.getElementById('from-hijri').value = data.fromHijri || '';
  document.getElementById('to-hijri').value = data.toHijri || '';

  // Priorities
  if (data.priorities) {
    const items = document.querySelectorAll('.top-priorities .priority-item');
    data.priorities.forEach((p, i) => {
      if (items[i]) {
        items[i].querySelector('input[type="checkbox"]').checked = p.checked;
        items[i].querySelector('input[type="text"]').value = p.text;
      }
    });
  }

  // Days
  if (data.days) {
    const rows = document.querySelectorAll('.day-row');
    data.days.forEach((d, i) => {
      if (!rows[i]) return;
      rows[i].querySelector('.d-greg').value = d.gregD || '';
      rows[i].querySelector('.m-greg').value = d.gregM || '';
      rows[i].querySelector('.d-hijri').value = d.hijriD || '';
      rows[i].querySelector('.m-hijri').value = d.hijriM || '';
      rows[i].querySelector('.coffee')?.classList.toggle('active', !!d.coffee);
      rows[i].querySelector('.appt')?.classList.toggle('active', !!d.appt);
      rows[i].querySelector('.star-icon')?.classList.toggle('active', !!d.star);
      rows[i].querySelector('.task-icon')?.classList.toggle('active', !!d.task);
    });
  }

  // Quick tasks
  if (data.quickTasks) {
    const items = document.querySelectorAll('.quick-tasks .task-item');
    data.quickTasks.forEach((t, i) => {
      if (items[i]) {
        items[i].querySelector('input[type="checkbox"]').checked = t.checked;
        items[i].querySelector('input[type="text"]').value = t.text;
      }
    });
  }

  // Achievements
  if (data.achievements) {
    const items = document.querySelectorAll('.achievement-item');
    data.achievements.forEach((a, i) => {
      if (!items[i]) return;
      items[i].querySelector('input[type="text"]').value = a.text || '';
      const stars = items[i].querySelectorAll('.star');
      stars.forEach(s => {
        s.classList.toggle('filled', parseInt(s.dataset.value) <= (a.rating || 0));
      });
    });
  }

    \`;

  });
}
buildHourTable();

// ===== STAR RATING (reusable) =====
function initStarRating(container){
  for(let i=1; i<=5; i++){
    const s = document.createElement('span');
    s.className = 'star-sm';
    s.textContent = '★';
    s.dataset.value = i;
    s.addEventListener('click', function(){
      const val = parseInt(this.dataset.value);
      this.parentElement.querySelectorAll('.star-sm').forEach(s2 => {
        s2.classList.toggle('filled', parseInt(s2.dataset.value) <= val);
      });
      autoSave();
    });
    container.appendChild(s);
  }
}

// Initialize all star ratings
document.querySelectorAll('.star-rating-sm').forEach(el => {
  if(!el.hasChildNodes() || el.children.length===0) initStarRating(el);
});

// ===== SAVE / LOAD =====
function gatherData(){
  const data = {
    greg: document.getElementById('day-date-greg').value,
    hijri: document.getElementById('day-date-hijri').value,
    dayName: document.getElementById('day-name').value,

}

const STORAGE_KEY = 'hayaat_habit_tracker';
const DEFAULT_HABITS = [
  {emoji:'🧘', name:'رياضة / تمارين'},
  {emoji:'📖', name:'قراءة'},
  {emoji:'💧', name:'8 أكواب ماء'},
  {emoji:'🥗', name:'أكل صحي'},
  {emoji:'🕌', name:'صلاة الفجر'},
  {emoji:'📝', name:'تخطيط اليوم'}
];

let state = { habits: [], days: 30 };

function initState(){
  state.habits = DEFAULT_HABITS.map(h=>({...h}));
  state.days = 30;
}
initState();

function rebuildTable(){
  const days = parseInt(document.getElementById('day-count').value) || 30;
  state.days = days;
  const tbl = document.getElementById('habit-table');
  tbl.innerHTML = '';

  // THEAD
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.textContent = '🧬 العادة';
  tr.appendChild(th0);

  for(let d=1; d<=days; d++){
    const th = document.createElement('th');
    th.textContent = d;
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  tbl.appendChild(thead);

  // TBODY
  const tbody = document.createElement('tbody');
  state.habits.forEach((habit, hi) => {
    const row = document.createElement('tr');

    // Habit name cell
    const tdName = document.createElement('td');
    tdName.innerHTML = \`
      <div class="habit-name-cell">
        <span class="habit-emoji">\${habit.emoji}</span>
        <input type="text" class="habit-name-input" data-habit="\${hi}" value="\${habit.name}" placeholder="اسم العادة">
      </div>
    \`;
    row.appendChild(tdName);

    // Day cells
    for(let d=0; d<days; d++){
      const td = document.createElement('td');
      td.innerHTML = \`
        <div class="day-cell">
          <label class="cb-wrap">
            <input type="checkbox" class="habit-cb" data-habit="\${hi}" data-day="\${d}">
            <span class="cb-box"></span>
          </label>
        </div>
      \`;
      row.appendChild(td);
    }

    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);

  // Restore saved states
  loadCheckboxes();
  attachListeners();
  updateStats();
}

function loadCheckboxes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.habits) state.habits = saved.habits;
    if(saved.days) state.days = saved.days;
    if(saved.checks){
      document.querySelectorAll('.habit-cb').forEach(cb => {
        const h = parseInt(cb.dataset.habit);
        const d = parseInt(cb.dataset.day);
        const key = \`\${h}_\${d}\`;
        cb.checked = !!saved.checks[key];
      });
    }
    // Restore habit names
    document.querySelectorAll('.habit-name-input').forEach(inp => {
      const hi = parseInt(inp.dataset.habit);
      if(state.habits[hi]) inp.value = state.habits[hi].name;
    });
  }catch(e){}
}

function attachListeners(){
  document.querySelectorAll('.habit-cb').forEach(cb => {
    cb.addEventListener('change', ()=>{
      autoSave();
      updateStats();
    });
  });
  document.querySelectorAll('.habit-name-input').forEach(inp => {
    inp.addEventListener('input', ()=>{
      const hi = parseInt(inp.dataset.habit);
      if(state.habits[hi]) state.habits[hi].name = inp.value;
      autoSave();
    });
  });
}

function gatherCheckData(){
  const checks = {};
  document.querySelectorAll('.habit-cb').forEach(cb => {
    const h = parseInt(cb.dataset.habit);
    const d = parseInt(cb.dataset.day);
    checks[\`\${h}_\${d}\`] = cb.checked;
  });
  return checks;
}

function gatherHabitNames(){
  const habits = [];
  document.querySelectorAll('.habit-name-input').forEach(inp => {
    const hi = parseInt(inp.dataset.habit);
    habits.push({emoji: state.habits[hi]?.emoji || '📌', name: inp.value});
  });
  return habits;
}

function updateStats(){
  const cbs = document.querySelectorAll('.habit-cb');
  const days = state.days;
  const habitCount = state.habits.length;
  let totalChecked = 0;
  let todayChecked = 0;
  const habitTotals = new Array(habitCount).fill(0);

  cbs.forEach(cb => {
    if(cb.checked){
      totalChecked++;
      const h = parseInt(cb.dataset.habit);
      const d = parseInt(cb.dataset.day);
      habitTotals[h] = (habitTotals[h]||0) + 1;
      if(d === days-1) todayChecked++;
    }
  });

  const total = days * habitCount;
  const pct = total > 0 ? Math.round(totalChecked / total * 100) : 0;

  document.getElementById('stat-today').textContent = todayChecked;
  document.getElementById('stat-pct').textContent = pct + '%';

  // Best habit
  let bestIdx = -1, bestVal = -1;
  habitTotals.forEach((v,i)=>{ if(v>bestVal){bestVal=v;bestIdx=i} });
  if(bestIdx>=0){
    const name = state.habits[bestIdx]?.name || '';
    document.getElementById('stat-best').textContent = name ? \`\${name} (\${bestVal}/\${days})\` : '—';
  } else {
    document.getElementById('stat-best').textContent = '—';
  }
}

function saveData(){

  const data = {
    habits: gatherHabitNames(),

    monthGreg: document.getElementById('month-greg').value,

  };

    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){}
}

function clearAll(){
  if(!confirm('مسح جميع البيانات؟')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// Auto-save on month inputs

document.getElementById('month-hijri').addEventListener('input', autoSave);

// Load saved state on startup

  try{
    const raw = localStorage.getItem(STORAGE_KEY);

      const saved = JSON.parse(raw);

function renderGrid(gridId, items){
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = \`sticker \${item.cls || ''}\`;
    div.innerHTML = \`
      <div class="sticker-icon">\${item.icon}</div>
      <div class="sticker-label">\${item.label}</div>
    \`;
    div.addEventListener('click', function(e){
      e.stopPropagation();
      // Select this sticker visually
      document.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
      this.classList.add('selected');
      // Copy to clipboard
      const text = \`\${item.icon} \${item.label}\`;
      navigator.clipboard.writeText(text).then(()=>{
        showToast(\`📋 تم نسخ "\${text}"\`);
      }).catch(()=>{
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(\`📋 تم نسخ "\${text}"\`);
      });
    });
    grid.appendChild(div);
  });
}

const HIJRI_M=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const PRAYERS=['الفجر','الظهر','العصر','المغرب','العشاء'];
const DAYS=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function initSpiritual(){
  document.querySelectorAll('.s-tab-btn').forEach(b=>{b.addEventListener('click',function(){
    document.querySelectorAll('.s-tab-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');document.querySelectorAll('.s-page').forEach(p=>p.classList.remove('active'));
    const el=document.getElementById('s-'+this.dataset.sp);if(el)el.classList.add('active');
  });});
  renderIbada();renderSiyam();renderDua();loadSpiritual();
}
function renderIbada(){const t=document.getElementById('ibada-table');if(!t)return;
  let h='<thead><tr><th>اليوم</th>';PRAYERS.forEach(p=>{h+='<th>'+p+'</th>';});
  h+='<th>📖</th><th>☀️</th><th>🌅</th></tr></thead><tbody>';
  DAYS.forEach((d,di)=>{
    h+='<tr><td>'+d+'</td>';
    PRAYERS.forEach((p,pi)=>{h+='<td><label class="cb-mini"><input type="checkbox" class="ib-cb" data-day="'+di+'" data-prayer="'+pi+'"><span class="cb-m-box"></span></label></td>';});
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-quran" data-day="'+di+'"><span class="cb-m-box"></span></label></td>';
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-subh" data-day="'+di+'"><span class="cb-m-box"></span></label></td>';
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-masa" data-day="'+di+'"><span class="cb-m-box"></span></label></td></tr>';
  });h+='</tbody>';t.innerHTML=h;
  document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(c=>{c.addEventListener('change',()=>{updIbada();saveSp();});});
  updIbada();
}
function updIbada(){const ch=document.querySelectorAll('#s-ibada .ib-cb:checked').length;const q=document.querySelectorAll('#s-ibada .ib-quran:checked').length;const s=document.querySelectorAll('#s-ibada .ib-subh:checked').length;const m=document.querySelectorAll('#s-ibada .ib-masa:checked').length;const e=document.getElementById('ibada-stats');if(!e)return;e.innerHTML='<span>✅ الصلوات: <strong>'+ch+'/35</strong></span><span>📖: <strong>'+q+'/7</strong></span><span>☀️🌅: <strong>'+(s+m)+'/14</strong></span>';}
function renderSiyam(){const t=document.getElementById('siyam-table');if(!t)return;
  let h='<thead><tr><th>الشهر</th><th>١٣</th><th>١٤</th><th>١٥</th></tr></thead><tbody>';
  HIJRI_M.forEach((m,mi)=>{h+='<tr><td>'+m+'</td>';[13,14,15].forEach(d=>{h+='<td><label class="cb-mini"><input type="checkbox" class="siyam-cb" data-month="'+mi+'" data-day="'+d+'"><span class="cb-m-box"></span></label></td>';});h+='</tr>';});
  h+='</tbody>';t.innerHTML=h;document.querySelectorAll('.siyam-cb').forEach(c=>{c.addEventListener('change',saveSp);});
}
function renderDua(){const g=document.getElementById('khatma-grid');if(!g)return;
  for(let i=1;i<=30;i++){const l=document.createElement('label');l.className='cb-mini';l.style.cssText='flex-direction:column;gap:2px;';l.innerHTML='<input type="checkbox" class="khatma-cb" data-part="'+i+'"><span class="cb-m-box"></span><span style="font-size:10px;color:var(--text-gray);">'+i+'</span>';g.appendChild(l);}
  document.querySelectorAll('#s-dua textarea, #s-dua .sp-goal, #s-dua input[type="checkbox"]').forEach(el=>{if(el.tagName==='TEXTAREA'||el.classList.contains('sp-goal'))el.addEventListener('input',saveSp);else el.addEventListener('change',saveSp);});
}
const SP_K='hayaat_spiritual';
function saveSp(){try{const d={ibada:{},siyam:{},dua:{goals:{},text:'',khatma:{}}};
  document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(c=>{d.ibada[c.className+'_'+c.dataset.day+'_'+(c.dataset.prayer||'')]=c.checked;});
  document.querySelectorAll('.siyam-cb').forEach(c=>{d.siyam[c.dataset.month+'_'+c.dataset.day]=c.checked;});
  const e=document.getElementById('dua-text');if(e)d.dua.text=e.value;
  ['sp-goal1','sp-goal2','sp-goal3'].forEach(id=>{const el=document.getElementById(id);if(el)d.dua.goals[id]=el.value;});
  document.querySelectorAll('.khatma-cb').forEach(c=>{d.dua.khatma[c.dataset.part]=c.checked;});
  localStorage.setItem(SP_K,JSON.stringify(d));}catch(ex){}
}
function loadSpiritual(){try{const r=localStorage.getItem(SP_K);if(!r)return;const d=JSON.parse(r);
  if(d.ibada){document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(c=>{c.checked=!!d.ibada[c.className+'_'+c.dataset.day+'_'+(c.dataset.prayer||'')];});updIbada();}
  if(d.siyam){document.querySelectorAll('.siyam-cb').forEach(c=>{c.checked=!!d.siyam[c.dataset.month+'_'+c.dataset.day];});}
  if(d.dua){const e=document.getElementById('dua-text');if(e)e.value=d.dua.text||'';
  if(d.dua.goals){Object.keys(d.dua.goals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=d.dua.goals[id]||'';});}
  if(d.dua.khatma){document.querySelectorAll('.khatma-cb').forEach(c=>{c.checked=!!d.dua.khatma[c.dataset.part];});}}
  }catch(ex){}
}
