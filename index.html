<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحياة المتوازنة — الباقة الشاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep-purple:#4A1D6E;--soft-purple:#8B5CF6;--light-purple:#D8B4FE;
  --pale-lavender:#F3E8FF;--gold-primary:#D4A843;--gold-light:#F5E6B8;
  --bg-cream:#FFFAF5;--text-dark:#2D1B3E;--text-gray:#6B5B7B;
  --card-bg:#FFFFFF;--border-soft:#E8DFF0;--success-green:#22C55E;
  --star-filled:#D4A843;--star-empty:#E2D4F0;--hour-odd:#FAF7FF;
  --sidebar-w:220px;
}
body{font-family:'Tajawal',sans-serif;direction:rtl;background:#FAF7FF;color:var(--text-dark);overflow:hidden;height:100vh}

/* SIDEBAR */
.sidebar{
  position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;
  background:linear-gradient(180deg,var(--deep-purple),#3A1558);
  display:flex;flex-direction:column;z-index:1000;
  box-shadow:-4px 0 20px rgba(0,0,0,.15);
}
.sidebar-brand{
  padding:18px 14px 10px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.sidebar-brand h2{color:var(--gold-primary);font-size:19px;font-weight:800;line-height:1.3}
.sidebar-brand .sub{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0;}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:9px 16px;
  cursor:pointer;color:rgba(255,255,255,.65);transition:all .25s;
  font-size:13px;font-weight:500;border-right:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.active{
  background:rgba(212,168,67,.12);color:var(--gold-primary);
  border-right-color:var(--gold-primary);font-weight:700;
}
.nav-item .ico{font-size:17px;width:24px;text-align:center}
.sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1)}
.pdf-btn{
  width:100%;padding:10px;border:none;border-radius:8px;
  background:linear-gradient(135deg,var(--gold-primary),#C49430);
  color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .25s;
}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,168,67,.4)}
.pdf-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* MAIN */
.main{
  margin-right:var(--sidebar-w);height:100vh;overflow-y:auto;
  padding:20px;
  background:linear-gradient(135deg,#F3E8FF 0%,#FFFAF5 50%,#FFF5F0 100%);
}
.tab-content{display:none}
.tab-content.active{display:block}

/* TOAST */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--deep-purple);color:white;padding:10px 24px;border-radius:10px;
  font-size:14px;opacity:0;transition:all .4s;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* PRINT */
@media print{
  @page{margin:0}
  .sidebar{display:none!important}
  .main{margin-right:0!important;padding:0!important;overflow:visible!important;height:auto!important}
  body{overflow:visible!important}
  .toast{display:none!important}
  .btn,.footer-actions{display:none!important}
  .tab-content{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <h2>🌸 الحياة<br>المتوازنة</h2>
    <div class="sub">الباقة الشاملة v1.0</div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <div class="nav-item active" data-tab="weekly"><span class="ico">🗓️</span>مخطط الأسبوع</div>
    <div class="nav-item" data-tab="daily"><span class="ico">🌟</span>المخطط اليومي</div>
    <div class="nav-item" data-tab="habits"><span class="ico">📊</span>العادات الشهرية</div>
    <div class="nav-item" data-tab="stickers"><span class="ico">📔</span>كتاب الملصقات</div>
    <div class="nav-item" data-tab="spiritual"><span class="ico">🕌</span>روحانيات</div>
  </nav>
  <div class="sidebar-footer">
    <button class="pdf-btn" id="pdf-btn" onclick="exportPDF()">💾 تصدير PDF</button>
  </div>
</aside>

<main class="main" id="main-content"></main>
<div class="toast" id="toast"></div>

<script>
// ===== SPA CORE =====
const TABS = ['weekly','daily','habits','stickers','spiritual'];
let activeTab = localStorage.getItem('hayaat_tab') || 'weekly';

// Tab switching
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function(){
    const tab = this.dataset.tab;
    if(tab === activeTab) return;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    this.classList.add('active');
    activeTab = tab;
    localStorage.setItem('hayaat_tab', tab);
    loadTabContent(tab);
  });
});

// Load tab content
async function loadTabContent(tabId){
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-gray);font-size:16px;">⏳ جاري التحميل...</div>';

  if(tabId === 'spiritual'){
    main.innerHTML = `<div class="tab-content active" id="tab-spiritual">${SPIRITUAL_HTML}</div>`;
    initSpiritual();
    return;
  }

  try{
    const res = await fetch(tabId + '.html');
    const html = await res.text();
    let body = html;
    const m = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if(m) body = m[1];
    // Extract scripts from body
    const scripts = [];
    body = body.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, (m, code) => {
      if(code.trim()) scripts.push(code.trim());
      return '';
    });
    main.innerHTML = `<div class="tab-content active" id="tab-${tabId}">${body}</div>`;
    // Re-init
    setTimeout(() => {
      scripts.forEach(code => {
        try{ new Function(code)(); }catch(e){ console.warn('Script exec error:', e); }
      });
      initTabScripts(tabId);
    }, 50);
  }catch(e){
    main.innerHTML = `<div class="tab-content active" id="tab-${tabId}"><div style="text-align:center;padding:40px;color:var(--text-gray);">❌ تعذر تحميل المحتوى</div></div>`;
  }
}

function initTabScripts(tabId){
  switch(tabId){
    case 'weekly': initWeekly(); break;
    case 'daily': initDaily(); break;
    case 'habits': initHabits(); break;
    case 'stickers': initStickers(); break;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ===== EXPORT PDF =====
async function exportPDF(){
  const btn = document.getElementById('pdf-btn');
  btn.disabled = true; btn.textContent = '⏳ جاري التصدير...';

  try{
    // Load jsPDF and html2canvas
    const [{ default: jsPDF }, html2canvas] = await Promise.all([
      import('./node_modules/jspdf/dist/jspdf.umd.min.js'),
      import('./node_modules/html2canvas/dist/html2canvas.min.js').then(m => m.default || m)
    ]);

    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = 210, pageH = 297;

    // Capture all tabs except stickers (they're decorative)
    const captureTabs = ['weekly','daily','habits','spiritual'];
    let pageIndex = 0;

    for(const tabId of captureTabs){
      // Load the tab first if not active
      if(activeTab !== tabId){
        // We capture the tab by loading it temporarily
        // For now, capture current tab content
      }
    }

    // Capture current view
    const main = document.getElementById('main-content');
    const canvas = await html2canvas(main, {
      scale: 2, useCORS: true, backgroundColor: '#FFFFFF',
      logging: false
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const imgW = pageW;
    const imgH = (canvas.height / canvas.width) * pageW;
    let heightLeft = imgH;
    let position = 0;

    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;

    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }

    const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
    pdf.save(`الحياة-المتوازنة-${date}.pdf`);
    showToast('✅ تم تحميل PDF بنجاح');
  }catch(e){
    console.error('PDF export error:', e);
    showToast('❌ فشل التصدير: ' + e.message);
  }

  btn.disabled = false; btn.textContent = '💾 تصدير PDF';
}
</script>

<script>
// ===== SPIRITUAL CONTENT =====
const SPIRITUAL_HTML = `
<div style="max-width:800px;margin:0 auto;">
  <div class="spiritual-tabs" style="display:flex;gap:4px;margin-bottom:16px;background:white;border-radius:12px;padding:4px;border:1.5px solid var(--border-soft);">
    <button class="s-tab-btn active" data-sp="ibada">🕌 العبادات</button>
    <button class="s-tab-btn" data-sp="siyam">🌙 الأيام البيض</button>
    <button class="s-tab-btn" data-sp="dua">🤲 الدعاء والأهداف</button>
  </div>
  <div id="s-ibada" class="s-page active"></div>
  <div id="s-siyam" class="s-page"></div>
  <div id="s-dua" class="s-page"></div>
</div>
`;

function initSpiritual(){
  injectSpiritualCSS();
  renderIbada();
  renderSiyam();
  renderDua();
  // Sub-tab switching
  document.querySelectorAll('.s-tab-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('.s-tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.s-page').forEach(p => p.classList.remove('active'));
      document.getElementById('s-' + this.dataset.sp).classList.add('active');
    });
  });
}

function injectSpiritualCSS(){
  if(document.getElementById('sp-css')) return;
  const style = document.createElement('style');
  style.id = 'sp-css';
  style.textContent = `
    .s-tab-btn{
      flex:1;padding:8px 12px;border:none;border-radius:8px;
      font-family:'Tajawal',sans-serif;font-size:13px;font-weight:500;
      cursor:pointer;background:transparent;color:var(--text-gray);transition:all .25s;
    }
    .s-tab-btn.active{background:linear-gradient(135deg,var(--deep-purple),var(--soft-purple));color:white;font-weight:700}
    .s-tab-btn:hover:not(.active){background:var(--pale-lavender)}
    .s-page{display:none}
    .s-page.active{display:block}
    .sp-card{background:white;border:1.5px solid var(--border-soft);border-radius:12px;padding:16px;margin-bottom:12px}
    .sp-card h3{font-size:15px;font-weight:700;color:var(--deep-purple);margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .sp-table{width:100%;border-collapse:collapse;font-size:13px}
    .sp-table th{background:linear-gradient(180deg,var(--deep-purple),var(--soft-purple));color:white;padding:5px 4px;font-weight:500;text-align:center;border:1px solid rgba(255,255,255,.15)}
    .sp-table td{border:1px solid var(--border-soft);text-align:center;padding:4px}
    .sp-table td:first-child{font-weight:700;color:var(--text-dark);text-align:right;padding-right:8px}
    .aya-box{text-align:center;padding:20px;background:linear-gradient(135deg,var(--pale-lavender),#FFF0F5);border-radius:12px;margin-bottom:12px;border:1.5px solid var(--border-soft)}
    .aya-text{font-size:22px;font-weight:700;color:var(--deep-purple);line-height:1.8}
    .aya-ref{font-size:13px;color:var(--text-gray);margin-top:4px}
    .dua-area{width:100%;min-height:80px;border:1.5px solid var(--border-soft);border-radius:8px;padding:10px;font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;outline:none;background:#FDFBFF}
    .dua-area:focus{border-color:var(--soft-purple)}
    .sp-input{border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:3px 0;background:transparent;width:100%;color:var(--text-dark)}
    .sp-input:focus{border-bottom-color:var(--gold-primary)}
    /* Checkbox mini */
    .cb-mini{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
    .cb-mini input{display:none}
    .cb-mini .cb-m-box{width:18px;height:18px;border:2px solid var(--border-soft);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:white;background:white}
    .cb-mini input:checked+.cb-m-box{background:var(--success-green);border-color:var(--success-green)}
    .cb-mini input:checked+.cb-m-box::after{content:"✓"}
    .siyam-cell{display:flex;gap:4px;justify-content:center;align-items:center}
    .siyam-day{font-size:12px;color:var(--text-gray);width:20px;text-align:center}
    .khatma-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
    .khatma-grid .cb-mini{flex-direction:column;gap:2px;font-size:11px;color:var(--text-gray)}
    .khatma-grid .cb-mini .cb-m-box{width:22px;height:22px;border-radius:6px}
  `;
  document.head.appendChild(style);
}

// ===== PAGE 1: IBADA =====
function renderIbada(){
  const days = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
  const prayers = ['الفجر','الظهر','العصر','المغرب','العشاء'];
  let html = '<div class="sp-card"><h3>🕌 مخطط العبادات الأسبوعي</h3><table class="sp-table"><thead><tr><th>اليوم</th>';
  prayers.forEach(p => { html += `<th>${p}</th>`; });
  html += '<th>📖 ورد<br>القرآن</th><th>📿 أذكار<br>الصباح</th><th>🌅 أذكار<br>المساء</th></tr></thead><tbody>';
  days.forEach((d,di) => {
    html += `<tr><td>${d}</td>`;
    prayers.forEach((p,pi) => {
      html += `<td><label class="cb-mini"><input type="checkbox" class="ib-cb" data-day="${di}" data-prayer="${pi}"><span class="cb-m-box"></span></label></td>`;
    });
    html += `<td><label class="cb-mini"><input type="checkbox" class="ib-quran" data-day="${di}"><span class="cb-m-box"></span></label></td>`;
    html += `<td><label class="cb-mini"><input type="checkbox" class="ib-subh" data-day="${di}"><span class="cb-m-box"></span></label></td>`;
    html += `<td><label class="cb-mini"><input type="checkbox" class="ib-masa" data-day="${di}"><span class="cb-m-box"></span></label></td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="sp-card"><h3>📊 إحصاءات العبادات</h3><div id="ibada-stats" style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-gray);">⏳</div></div>';
  document.getElementById('s-ibada').innerHTML = html;
  // Attach listeners to update stats
  document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', ()=>{
      updateIbadaStats();
      saveSpiritual();
    });
  });
  updateIbadaStats();
}

function updateIbadaStats(){
  const totalCbs = document.querySelectorAll('#s-ibada .ib-cb').length;
  const checked = document.querySelectorAll('#s-ibada .ib-cb:checked').length;
  const quran = document.querySelectorAll('#s-ibada .ib-quran:checked').length;
  const subh = document.querySelectorAll('#s-ibada .ib-subh:checked').length;
  const masa = document.querySelectorAll('#s-ibada .ib-masa:checked').length;
  const total = totalCbs + 7*3; // prayers(7*5=35) + quran(7) + subh(7) + masa(7)=56
  const done = checked + quran + subh + masa;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('ibada-stats').innerHTML = `
    <span>✅ الصلوات: <strong>${checked}/${totalCbs}</strong></span>
    <span>📖 القرآن: <strong>${quran}/7</strong></span>
    <span>☀️ الأذكار: <strong>${subh+masa}/14</strong></span>
    <span>📊 الإجمالي: <strong>${pct}%</strong></span>
  `;
}

// ===== PAGE 2: SIYAM (WHITE DAYS) =====
const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function renderSiyam(){
  let html = '<div class="sp-card"><h3>🌙 متعقب صيام الأيام البيض (13-14-15 هجري)</h3><table class="sp-table"><thead><tr><th>الشهر الهجري</th><th>١٣</th><th>١٤</th><th>١٥</th></tr></thead><tbody>';
  HIJRI_MONTHS.forEach((m,mi) => {
    html += `<tr><td>${m}</td>`;
    [13,14,15].forEach(d => {
      html += `<td><label class="cb-mini"><input type="checkbox" class="siyam-cb" data-month="${mi}" data-day="${d}"><span class="cb-m-box"></span></label></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="sp-card"><h3>📊 إجمالي الصيام</h3><p style="font-size:15px;color:var(--text-dark);">✅ الأيام التي صُمتِها: <strong id="siyam-total">0</strong> / 36</p></div>';
  document.getElementById('s-siyam').innerHTML = html;
  document.querySelectorAll('#s-siyam input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', ()=>{
      updateSiyamStats();
      saveSpiritual();
    });
  });
  updateSiyamStats();
}

function updateSiyamStats(){
  const checked = document.querySelectorAll('#s-siyam .siyam-cb:checked').length;
  document.getElementById('siyam-total').textContent = checked;
}

// ===== PAGE 3: DUA =====
function renderDua(){
  let html = `
    <div class="aya-box">
      <div class="aya-text">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</div>
      <div class="aya-ref">سورة طه — الآية ١١٤</div>
    </div>
    <div class="sp-card">
      <h3>🤲 أدعيتي المخصصة</h3>
      <textarea class="dua-area" id="dua-text" placeholder="اكتبي أدعيتك المفضلة هنا..."></textarea>
    </div>
    <div class="sp-card">
      <h3>🎯 أهدافي الروحانية للسنة</h3>
      <div style="margin-bottom:8px;"><input type="text" class="sp-input" id="sp-goal1" placeholder="الهدف الروحاني الأول..."></div>
      <div style="margin-bottom:8px;"><input type="text" class="sp-input" id="sp-goal2" placeholder="الهدف الروحاني الثاني..."></div>
      <div><input type="text" class="sp-input" id="sp-goal3" placeholder="الهدف الروحاني الثالث..."></div>
    </div>
    <div class="sp-card">
      <h3>📖 تتبع ختمة القرآن</h3>
      <p style="font-size:13px;color:var(--text-gray);margin-bottom:8px;">ضعي علامة ✓ عند إتمام كل جزء</p>
      <div class="khatma-grid" id="khatma-grid"></div>
    </div>
  `;
  document.getElementById('s-dua').innerHTML = html;
  // Build khatma grid (30 parts)
  const grid = document.getElementById('khatma-grid');
  for(let i=1; i<=30; i++){
    const lbl = document.createElement('label');
    lbl.className = 'cb-mini';
    lbl.style.cssText = 'flex-direction:column;gap:2px;';
    lbl.innerHTML = `<input type="checkbox" class="khatma-cb" data-part="${i}"><span class="cb-m-box"></span><span style="font-size:10px;color:var(--text-gray);">${i}</span>`;
    grid.appendChild(lbl);
  }
  // Auto-save
  document.querySelectorAll('#s-dua textarea, #s-dua .sp-input, #s-dua input[type="checkbox"]').forEach(el => {
    el.addEventListener('change', saveSpiritual);
    if(el.tagName === 'TEXTAREA' || el.classList.contains('sp-input')) el.addEventListener('input', saveSpiritual);
  });
  loadSpiritual();
}

// ===== SPIRITUAL SAVE/LOAD =====
const SP_KEY = 'hayaat_spiritual';

function saveSpiritual(){
  try{
    const data = {
      ibada: {},
      siyam: {},
      dua: {},
      goals: {},
      khatma: {}
    };
    // Ibada
    document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(cb => {
      data.ibada[cb.className + '_' + (cb.dataset.day||'') + '_' + (cb.dataset.prayer||'') + '_' + (cb.dataset.month||'')] = cb.checked;
    });
    // Siyam
    document.querySelectorAll('#s-siyam .siyam-cb').forEach(cb => {
      data.siyam[cb.dataset.month + '_' + cb.dataset.day] = cb.checked;
    });
    // Dua text
    const duaEl = document.getElementById('dua-text');
    if(duaEl) data.dua.text = duaEl.value;
    // Goals
    ['sp-goal1','sp-goal2','sp-goal3'].forEach(id => {
      const el = document.getElementById(id);
      if(el) data.goals[id] = el.value;
    });
    // Khatma
    document.querySelectorAll('.khatma-cb').forEach(cb => {
      data.khatma[cb.dataset.part] = cb.checked;
    });

    localStorage.setItem(SP_KEY, JSON.stringify(data));
  }catch(e){}
}

function loadSpiritual(){
  try{
    const raw = localStorage.getItem(SP_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    // Ibada
    if(data.ibada){
      document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(cb => {
        const key = cb.className + '_' + (cb.dataset.day||'') + '_' + (cb.dataset.prayer||'') + '_' + (cb.dataset.month||'');
        cb.checked = !!data.ibada[key];
      });
      updateIbadaStats();
    }
    // Siyam
    if(data.siyam){
      document.querySelectorAll('.siyam-cb').forEach(cb => {
        const key = cb.dataset.month + '_' + cb.dataset.day;
        cb.checked = !!data.siyam[key];
      });
      updateSiyamStats();
    }
    // Dua
    const duaEl = document.getElementById('dua-text');
    if(duaEl && data.dua) duaEl.value = data.dua.text || '';
    // Goals
    if(data.goals){
      Object.keys(data.goals).forEach(id => {
        const el = document.getElementById(id);
        if(el) el.value = data.goals[id] || '';
      });
    }
    // Khatma
    if(data.khatma){
      document.querySelectorAll('.khatma-cb').forEach(cb => {
        cb.checked = !!data.khatma[cb.dataset.part];
      });
    }
  }catch(e){}
}

// ===== INITIALIZE =====
// Start
loadTabContent(activeTab);
</script>
