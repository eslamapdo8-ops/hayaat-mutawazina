<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحياة المتوازنة — الباقة الشاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --deep-purple:#4A1D6E;--soft-purple:#8B5CF6;--light-purple:#D8B4FE;
  --pale-lavender:#F3E8FF;--gold-primary:#D4A843;--gold-light:#F5E6B8;
  --bg-cream:#FFFAF5;--text-dark:#2D1B3E;--text-gray:#6B5B7B;
  --card-bg:#FFFFFF;--border-soft:#E8DFF0;--success-green:#22C55E;
  --star-filled:#D4A843;--star-empty:#E2D4F0;--hour-odd:#FAF7FF;
  --sidebar-w:220px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;direction:rtl;background:#FAF7FF;color:var(--text-dark);overflow:hidden;height:100vh}
.sidebar{
  position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;
  background:linear-gradient(180deg,var(--deep-purple),#3A1558);
  display:flex;flex-direction:column;z-index:1000;box-shadow:-4px 0 20px rgba(0,0,0,.15);
}
.sidebar-brand{padding:18px 14px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand h2{color:var(--gold-primary);font-size:19px;font-weight:800;line-height:1.3}
.sidebar-brand .sub{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;
  color:rgba(255,255,255,.65);transition:all .25s;font-size:13px;font-weight:500;
  border-right:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.active{background:rgba(212,168,67,.12);color:var(--gold-primary);border-right-color:var(--gold-primary);font-weight:700}
.nav-item .ico{font-size:17px;width:24px;text-align:center}
.sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1)}
.pdf-btn{width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold-primary),#C49430);color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,168,67,.4)}
.main{margin-right:var(--sidebar-w);height:100vh;overflow-y:auto;padding:20px;background:linear-gradient(135deg,#F3E8FF 0%,#FFFAF5 50%,#FFF5F0 100%)}
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--deep-purple);color:white;padding:10px 24px;border-radius:10px;font-size:14px;opacity:0;transition:all .4s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Spiritual styles */
.sp-card{background:white;border:1.5px solid var(--border-soft);border-radius:12px;padding:16px;margin-bottom:12px}
.sp-card h3{font-size:15px;font-weight:700;color:var(--deep-purple);margin-bottom:10px}
.sp-table{width:100%;border-collapse:collapse;font-size:13px}
.sp-table th{background:linear-gradient(180deg,var(--deep-purple),var(--soft-purple));color:white;padding:5px 4px;font-weight:500;text-align:center;border:1px solid rgba(255,255,255,.15)}
.sp-table td{border:1px solid var(--border-soft);text-align:center;padding:4px}
.sp-table td:first-child{font-weight:700;color:var(--text-dark);text-align:right;padding-right:8px}
.aya-box{text-align:center;padding:20px;background:linear-gradient(135deg,var(--pale-lavender),#FFF0F5);border-radius:12px;margin-bottom:12px;border:1.5px solid var(--border-soft)}
.aya-text{font-size:22px;font-weight:700;color:var(--deep-purple);line-height:1.8}
.aya-ref{font-size:13px;color:var(--text-gray);margin-top:4px}
.s-tab-btn{flex:1;padding:8px 12px;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-gray);transition:all .25s}
.s-tab-btn.active{background:linear-gradient(135deg,var(--deep-purple),var(--soft-purple));color:white;font-weight:700}
.s-page{display:none}.s-page.active{display:block}
.cb-mini{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cb-mini input{display:none}
.cb-mini .cb-m-box{width:18px;height:18px;border:2px solid var(--border-soft);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:white;background:white}
.cb-mini input:checked+.cb-m-box{background:var(--success-green);border-color:var(--success-green)}
.cb-mini input:checked+.cb-m-box::after{content:"✓"}
.khatma-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.khatma-grid .cb-mini{flex-direction:column;gap:2px;font-size:11px;color:var(--text-gray)}
.khatma-grid .cb-mini .cb-m-box{width:22px;height:22px;border-radius:6px}
.dua-area{width:100%;min-height:80px;border:1.5px solid var(--border-soft);border-radius:8px;padding:10px;font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;outline:none;background:#FDFBFF}
.sp-goal{border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:3px 0;background:transparent;width:100%;display:block}
.sp-goal:focus{border-bottom-color:var(--gold-primary)}
@media print{
  @page{margin:5mm}
  .sidebar{display:none!important}
  .main{margin-right:0!important;padding:0!important;overflow:visible!important;height:auto!important}
  body{overflow:visible!important}.toast{display:none!important}
  .tab-content{display:block!important;page-break-after:always}
  .tab-content:last-child{page-break-after:auto}
  .btn,.footer-actions{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <h2>🌸 الحياة<br>المتوازنة</h2>
    <div class="sub">الباقة الشاملة v1.0</div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    
    <div class="nav-item active" data-tab="weekly"><span class="ico">🗓️</span>مخطط الأسبوع</div>
    <div class="nav-item" data-tab="daily"><span class="ico">🌟</span>المخطط اليومي</div>
    <div class="nav-item" data-tab="habits"><span class="ico">📊</span>العادات الشهرية</div>
    <div class="nav-item" data-tab="stickers"><span class="ico">📔</span>كتاب الملصقات</div>
    <div class="nav-item" data-tab="spiritual"><span class="ico">🕌</span>روحانيات</div>

  </nav>
  <div class="sidebar-footer">
    <button class="pdf-btn" id="pdf-btn" onclick="window.print()">🖨️ PDF</button>
  </div>
</aside>

<main class="main" id="main-content"></main>
<div class="toast" id="toast"></div>

<script>
// Tab data
const TAB_BODIES = {};
const TAB_SCRIPTS = {};
TAB_BODIES['weekly'] = "";
TAB_SCRIPTS['weekly'] = "";
TAB_BODIES['daily'] = "";
TAB_SCRIPTS['daily'] = "";
TAB_BODIES['habits'] = "";
TAB_SCRIPTS['habits'] = "";
TAB_BODIES['stickers'] = "";
TAB_SCRIPTS['stickers'] = "";


let activeTab = localStorage.getItem('hayaat_tab') || 'weekly';

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function(){
    const tab = this.dataset.tab;
    if(tab === activeTab) return;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    this.classList.add('active');
    activeTab = tab;
    localStorage.setItem('hayaat_tab', tab);
    showTab(tab);
  });
});

function showTab(tabId){
  const main = document.getElementById('main-content');
  
  if(tabId === 'spiritual'){
    main.innerHTML = `<div class="tab-content active" id="tab-spiritual">
    <div class="sp-card">
      <div style="display:flex;gap:4px;margin-bottom:12px;background:white;border-radius:12px;padding:4px;border:1.5px solid var(--border-soft);">
        <button class="s-tab-btn active" data-sp="ibada">🕌 العبادات</button>
        <button class="s-tab-btn" data-sp="siyam">🌙 الأيام البيض</button>
        <button class="s-tab-btn" data-sp="dua">🤲 الدعاء</button>
      </div>
    </div>
    <div id="s-ibada" class="s-page active">
      <div class="sp-card"><h3>🕌 مخطط العبادات الأسبوعي</h3><table class="sp-table" id="ibada-table"></table></div>
      <div class="sp-card"><h3>📊 الإحصاءات</h3><div id="ibada-stats" style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-gray);"></div></div>
    </div>
    <div id="s-siyam" class="s-page">
      <div class="sp-card"><h3>🌙 صيام الأيام البيض (13-14-15 هجري)</h3><table class="sp-table" id="siyam-table"></table></div>
    </div>
    <div id="s-dua" class="s-page">
      <div class="aya-box"><div class="aya-text">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</div><div class="aya-ref">طه: ١١٤</div></div>
      <div class="sp-card"><h3>🤲 أدعيتي</h3><textarea class="dua-area" id="dua-text" placeholder="اكتبي أدعيتك..."></textarea></div>
      <div class="sp-card"><h3>🎯 أهداف روحانية</h3>
        <input type="text" class="sp-goal" id="sp-goal1" placeholder="الهدف الأول..." style="width:100%;margin-bottom:6px;border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:3px 0;background:transparent;">
        <input type="text" class="sp-goal" id="sp-goal2" placeholder="الهدف الثاني..." style="width:100%;margin-bottom:6px;border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:3px 0;background:transparent;">
        <input type="text" class="sp-goal" id="sp-goal3" placeholder="الهدف الثالث..." style="width:100%;border:none;border-bottom:1.5px dashed var(--border-soft);outline:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:3px 0;background:transparent;">
      </div>
      <div class="sp-card"><h3>📖 ختمة القرآن</h3><div class="khatma-grid" id="khatma-grid"></div></div>
    </div>
</div>`;
    initSpiritual();
    return;
  }
  
  const body = TAB_BODIES[tabId];
  const script = TAB_SCRIPTS[tabId];
  if(!body){
    main.innerHTML = '<div class="tab-content active"><p style="padding:40px;text-align:center;color:var(--text-gray);">⚠️ المحتوى غير متاح</p></div>';
    return;
  }
  
  main.innerHTML = `<div class="tab-content active" id="tab-${tabId}">${body}</div>`;
  
  if(script){
    try{
      const fn = new Function(script);
      fn();
    }catch(e){
      console.warn('Tab script error:', e);
    }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}


// Spiritual tab
const HIJRI_M = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const PRAYERS = ['الفجر','الظهر','العصر','المغرب','العشاء'];
const DAYS = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

function initSpiritual(){
  document.querySelectorAll('.s-tab-btn').forEach(b => {
    b.addEventListener('click', function(){
      document.querySelectorAll('.s-tab-btn').forEach(x => x.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.s-page').forEach(p => p.classList.remove('active'));
      const el = document.getElementById('s-'+this.dataset.sp);
      if(el) el.classList.add('active');
    });
  });
  renderIbada(); renderSiyam(); renderDua(); loadSpiritual();
}
function renderIbada(){
  const tbl = document.getElementById('ibada-table'); if(!tbl) return;
  let h='<thead><tr><th>اليوم</th>'; PRAYERS.forEach(p=>{h+='<th>'+p+'</th>';});
  h+='<th>📖 قرآن</th><th>☀️ صباح</th><th>🌅 مساء</th></tr></thead><tbody>';
  DAYS.forEach((d,di)=>{
    h+='<tr><td>'+d+'</td>';
    PRAYERS.forEach((p,pi)=>{h+='<td><label class="cb-mini"><input type="checkbox" class="ib-cb" data-day="'+di+'" data-prayer="'+pi+'"><span class="cb-m-box"></span></label></td>';});
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-quran" data-day="'+di+'"><span class="cb-m-box"></span></label></td>';
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-subh" data-day="'+di+'"><span class="cb-m-box"></span></label></td>';
    h+='<td><label class="cb-mini"><input type="checkbox" class="ib-masa" data-day="'+di+'"><span class="cb-m-box"></span></label></td></tr>';
  });
  h+='</tbody>'; tbl.innerHTML=h;
  document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(cb=>{cb.addEventListener('change',()=>{updIbada();saveSpiritual();});});
  updIbada();
}
function updIbada(){
  const ch=document.querySelectorAll('#s-ibada .ib-cb:checked').length;
  const q=document.querySelectorAll('#s-ibada .ib-quran:checked').length;
  const s=document.querySelectorAll('#s-ibada .ib-subh:checked').length;
  const m=document.querySelectorAll('#s-ibada .ib-masa:checked').length;
  const el=document.getElementById('ibada-stats'); if(!el) return;
  el.innerHTML='<span>✅ الصلوات: <strong>'+ch+'/35</strong></span><span>📖 القرآن: <strong>'+q+'/7</strong></span><span>☀️ الأذكار: <strong>'+(s+m)+'/14</strong></span>';
}
function renderSiyam(){
  const tbl=document.getElementById('siyam-table'); if(!tbl) return;
  let h='<thead><tr><th>الشهر</th><th>١٣</th><th>١٤</th><th>١٥</th></tr></thead><tbody>';
  HIJRI_M.forEach((m,mi)=>{
    h+='<tr><td>'+m+'</td>';
    [13,14,15].forEach(d=>{h+='<td><label class="cb-mini"><input type="checkbox" class="siyam-cb" data-month="'+mi+'" data-day="'+d+'"><span class="cb-m-box"></span></label></td>';});
    h+='</tr>';
  });
  h+='</tbody>'; tbl.innerHTML=h;
  document.querySelectorAll('.siyam-cb').forEach(cb=>{cb.addEventListener('change',saveSpiritual);});
}
function renderDua(){
  const g=document.getElementById('khatma-grid'); if(!g) return;
  for(let i=1;i<=30;i++){
    const l=document.createElement('label'); l.className='cb-mini'; l.style.cssText='flex-direction:column;gap:2px;';
    l.innerHTML='<input type="checkbox" class="khatma-cb" data-part="'+i+'"><span class="cb-m-box"></span><span style="font-size:10px;color:var(--text-gray);">'+i+'</span>';
    g.appendChild(l);
  }
  document.querySelectorAll('#s-dua textarea, #s-dua .sp-goal, #s-dua input[type="checkbox"]').forEach(el=>{
    if(el.tagName==='TEXTAREA'||el.classList.contains('sp-goal')) el.addEventListener('input',saveSpiritual);
    else el.addEventListener('change',saveSpiritual);
  });
}
const SP_K='hayaat_spiritual';
function saveSpiritual(){
  try{const d={ibada:{},siyam:{},dua:{goals:{},text:'',khatma:{}}};
  document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(c=>{d.ibada[c.className+'_'+c.dataset.day+'_'+(c.dataset.prayer||'')]=c.checked;});
  document.querySelectorAll('.siyam-cb').forEach(c=>{d.siyam[c.dataset.month+'_'+c.dataset.day]=c.checked;});
  const e=document.getElementById('dua-text'); if(e) d.dua.text=e.value;
  ['sp-goal1','sp-goal2','sp-goal3'].forEach(id=>{const el=document.getElementById(id);if(el) d.dua.goals[id]=el.value;});
  document.querySelectorAll('.khatma-cb').forEach(c=>{d.dua.khatma[c.dataset.part]=c.checked;});
  localStorage.setItem(SP_K,JSON.stringify(d));}catch(ex){}
}
function loadSpiritual(){
  try{const r=localStorage.getItem(SP_K);if(!r)return;const d=JSON.parse(r);
  if(d.ibada){document.querySelectorAll('#s-ibada input[type="checkbox"]').forEach(c=>{c.checked=!!d.ibada[c.className+'_'+c.dataset.day+'_'+(c.dataset.prayer||'')];});updIbada();}
  if(d.siyam){document.querySelectorAll('.siyam-cb').forEach(c=>{c.checked=!!d.siyam[c.dataset.month+'_'+c.dataset.day];});}
  if(d.dua){const e=document.getElementById('dua-text');if(e)e.value=d.dua.text||'';
  if(d.dua.goals){Object.keys(d.dua.goals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=d.dua.goals[id]||'';});}
  if(d.dua.khatma){document.querySelectorAll('.khatma-cb').forEach(c=>{c.checked=!!d.dua.khatma[c.dataset.part];});}}
  }catch(ex){}
}
// End spiritual


showTab(activeTab);
</script>
</body>
</html>
